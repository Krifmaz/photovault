org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# Server prefilled on the connect screen (BuildConfig.DEFAULT_SERVER_URL); empty = none.
# Override with -Pphotovault.defaultServer=https://photos.example.com
photovault.defaultServer=
# AGP 9 creates unit tests for the tested build type only; CI runs testReleaseUnitTest.
android.onlyEnableUnitTestForTheTestedBuildType=false
# Startup/Baseline Profile optimisations for R8 (perf/README.md).
android.experimental.art-profile-r8-rewriting=true
android.experimental.r8.dex-startup-optimization=true
