[package]
name = "photovault-server"
description = "Photovault server: a Rust re-implementation of the Ente Photos API (museum). Based on Ente (ente.com)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "photovault"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["macros", "query"] }
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
hex = "0.4"
hmac = "0.12"
libsodium-sys-stable = "1.24"
prometheus-client = "0.25"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "any", "postgres", "sqlite", "migrate", "macros"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "fs", "io-util", "net", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
toml = "0.9"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "request-id", "limit", "compression-gzip", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
futures-util = "0.3"
async-trait = "0.1"
bytes = "1"
url = "2"
subtle = "2"
# Pure-Rust big integers for the SRP-6a verifier checks used by account recovery.
num-bigint-dig = "0.8"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
md-5 = "0.10"
# users workstream: SRP math, TOTP, QR codes, passkeys (all pure Rust).
num-bigint = "0.4"
num-traits = "0.2"
sha1 = "0.10"
qrcode = { version = "0.14", default-features = false }
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "std"] }
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
ciborium = "0.2"
uuid = { version = "1", features = ["v4", "serde"] }
# Free space (statvfs) and the running uid for startup checks; pure Rust.
rustix = { version = "1", features = ["fs", "process"] }
# SMTP for verification codes. rustls with ring, no OpenSSL.
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls", "ring", "webpki-roots", "hostname"] }
# LAN discovery (_photovault._tcp); pure Rust.
mdns-sd = "0.21"

[dev-dependencies]
tempfile = "3"
http-body-util = "0.1"
