# PHOTOVAULT: mobile CI for the Photos app (mobile/apps/photos).
#
#   1. flutter analyze + flutter test (Ente's tests and test/photovault)
#   2. arm64 release APK (flavor `independent`, applicationId app.photovault)
#   3. uploads the APK and its SHA256SUMS as a workflow artifact
#   4. scripts/strip-report.py --check over the source and the built APK
#      (Ente hosts/branding left must be explained in
#      scripts/strip-allowlist.toml); the report is uploaded as an artifact
#   5. separate, non-blocking job: screenshots of an x86_64 debug build in an
#      Android emulator (artifact photovault-emulator-screens)
#
# Signing: with the repository secrets PHOTOVAULT_KEYSTORE_B64,
# PHOTOVAULT_KEYSTORE_PASSWORD, PHOTOVAULT_KEY_ALIAS and PHOTOVAULT_KEY_PASSWORD
# the APK is signed with the Photovault release key (Ente's SIGNING_* env
# vars, read by android/app/build.gradle). Without them (PR builds, forks) it
# is signed with a throwaway debug key and a warning says so. A release build
# (release.yml passes release: true) fails instead, and also checks the
# certificate against the Photovault key's fingerprint.
#
# Version: release.yml passes version (the tag without the v, the APK's
# versionName) and build_number (versionCode, rises with every release).
# Other builds use pubspec.yaml's version. The APK is
# photovault-<version>-arm64.apk.
#
# Size: R8 + resource shrinking (build.gradle), --split-per-abi (arm64 only),
# compressed native libraries, and Dart debug info split out of libapp.so
# (uploaded as the photovault-android-symbols artifact, for stack traces).
#
# Toolchain mirrors Ente's photos-build.yml: Flutter 3.47.8 (archive SHA-256
# from Ente's setup-flutter action), Temurin 17, rustup, the runner's Android
# SDK plus NDK 28.2.13676358 (Flutter 3.47.8's default). Actions are pinned by
# the commit SHAs Ente uses.
name: Photovault mobile

on:
    push:
        paths:
            - "mobile/**"
            - "rust/**"
            - "scripts/strip-*"
            - ".github/workflows/photovault-mobile.yml"
    pull_request:
        paths:
            - "mobile/**"
            - "rust/**"
            - "scripts/strip-*"
            - ".github/workflows/photovault-mobile.yml"
    workflow_dispatch:
    # release.yml attaches the APK to every release
    workflow_call:
        inputs:
            version:
                description: versionName, e.g. 0.1.5 (the release tag without the v)
                type: string
                default: ""
            build_number:
                description: versionCode; must rise with every release
                type: string
                default: ""
            release:
                description: Release build, the Photovault release key is required
                type: boolean
                default: false

permissions:
    contents: read

concurrency:
    # github.workflow is the caller's name when release.yml calls this, so the
    # release build and a push build of the same ref never cancel each other.
    group: ${{ github.workflow }}-photovault-mobile-${{ github.ref }}
    cancel-in-progress: true

env:
    # SHA-256 of the Photovault release certificate (photovault-fork/signing).
    PHOTOVAULT_CERT_SHA256: 4a090dbac96381d4352c7b77bdc31edbc6750d139db9a20927e5b13f07a319eb
    FLUTTER_VERSION: 3.47.8
    FLUTTER_SHA256: baf7dcc5a3dbba60fe863bf493a6cf203195621f7786eaa5a1bba02cd0d87dd2
    NDK_VERSION: 28.2.13676358

jobs:
    photos-android:
        runs-on: ubuntu-latest
        timeout-minutes: 120

        defaults:
            run:
                working-directory: mobile/apps/photos

        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Free runner disk space
              run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost

            - name: Setup JDK 17
              uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
              with:
                  distribution: "temurin"
                  java-version: "17"

            - name: Restore Flutter SDK
              id: flutter-cache
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  key: flutter-${{ runner.os }}-${{ runner.arch }}-${{ env.FLUTTER_VERSION }}
                  path: ${{ runner.tool_cache }}/flutter/${{ env.FLUTTER_VERSION }}

            - name: Install Flutter
              shell: bash
              working-directory: .
              env:
                  CACHE_HIT: ${{ steps.flutter-cache.outputs.cache-hit }}
              run: |
                  set -euo pipefail
                  root="$RUNNER_TOOL_CACHE/flutter/$FLUTTER_VERSION"
                  if [ "$CACHE_HIT" != true ]; then
                      archive="$RUNNER_TEMP/flutter.tar.xz"
                      curl --retry 3 --retry-all-errors -fsSL \
                          "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${FLUTTER_VERSION}-stable.tar.xz" \
                          -o "$archive"
                      printf '%s  %s\n' "$FLUTTER_SHA256" "$archive" | sha256sum -c -
                      mkdir -p "$root"
                      tar xf "$archive" -C "$root"
                      rm -f "$archive"
                  fi
                  echo "$root/flutter/bin" >> "$GITHUB_PATH"
                  # Same as Ente CI: drop the untranslated-messages report.
                  sed -i '/^untranslated-messages-file:/d' mobile/packages/strings/l10n.yaml

            - name: Install Android SDK packages
              shell: bash
              run: |
                  set -euo pipefail
                  sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
                  yes | "$sdkmanager" --licenses > /dev/null || true
                  # A corrupt NDK download ("Error reading Zip content") has been seen on
                  # hosted runners: retry with a clean partial-download state.
                  for attempt in 1 2 3; do
                      if "$sdkmanager" --install "platforms;android-36" "build-tools;35.0.0" \
                          "ndk;${NDK_VERSION}" "cmake;3.22.1" "platform-tools" > /dev/null; then
                          break
                      fi
                      [ "$attempt" = 3 ] && exit 1
                      rm -rf "$ANDROID_HOME/ndk/${NDK_VERSION}" "$ANDROID_HOME/.temp" "$HOME/.android/cache"
                      sleep 15
                  done
                  echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

            - name: Install Rust Android target
              run: rustup target add aarch64-linux-android

            - name: Rust cache
              uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
              with:
                  workspaces: rust
                  shared-key: photovault-mobile

            - run: flutter --version
            - run: flutter pub get --enforce-lockfile

            - name: Generate Rust bindings
              run: cargo codegen frb photos
              working-directory: rust

            - name: Analyze
              run: flutter analyze

            - name: Test
              run: flutter test

            - name: Prepare signing key
              id: signing
              shell: bash
              env:
                  PHOTOVAULT_KEYSTORE_B64: ${{ secrets.PHOTOVAULT_KEYSTORE_B64 }}
                  RELEASE: ${{ inputs.release || false }}
              run: |
                  set -euo pipefail
                  if [ -n "${PHOTOVAULT_KEYSTORE_B64}" ]; then
                      printf '%s' "${PHOTOVAULT_KEYSTORE_B64}" | base64 -d > "$RUNNER_TEMP/photovault-release.jks"
                      echo "key_path=$RUNNER_TEMP/photovault-release.jks" >> "$GITHUB_OUTPUT"
                  elif [ "$RELEASE" = true ]; then
                      echo "::error::No PHOTOVAULT_KEYSTORE_B64 secret: a release APK must be signed with the Photovault release key (see photovault-fork/signing/README.md)."
                      exit 1
                  else
                      echo "::warning::No PHOTOVAULT_KEYSTORE_B64 secret: the APK is signed with a debug key."
                      echo "key_path=" >> "$GITHUB_OUTPUT"
                  fi

            - name: Version
              id: version
              shell: bash
              env:
                  VERSION: ${{ inputs.version || '' }}
                  BUILD_NUMBER: ${{ inputs.build_number || '' }}
              run: |
                  set -euo pipefail
                  pub=$(sed -n 's/^version: *\([^ ]*\).*/\1/p' pubspec.yaml)
                  name="${VERSION:-${pub%%+*}}"
                  code="${BUILD_NUMBER:-${pub#*+}}"
                  [[ "$name" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::bad version: $name"; exit 1; }
                  [[ "$code" =~ ^[0-9]+$ ]] || { echo "::error::bad build number: $code"; exit 1; }
                  echo "versionName $name, versionCode $code"
                  { echo "name=$name"; echo "code=$code"; } >> "$GITHUB_OUTPUT"

            - name: Build arm64 release APK
              shell: bash
              env:
                  SIGNING_KEY_PATH: ${{ steps.signing.outputs.key_path }}
                  SIGNING_KEY_ALIAS: ${{ secrets.PHOTOVAULT_KEY_ALIAS }}
                  SIGNING_KEY_PASSWORD: ${{ secrets.PHOTOVAULT_KEY_PASSWORD }}
                  SIGNING_STORE_PASSWORD: ${{ secrets.PHOTOVAULT_KEYSTORE_PASSWORD }}
                  VERSION_NAME: ${{ steps.version.outputs.name }}
                  VERSION_CODE: ${{ steps.version.outputs.code }}
              run: |
                  set -euo pipefail
                  [ -n "$SIGNING_KEY_PATH" ] || unset SIGNING_KEY_PATH
                  flutter build apk --release --flavor independent \
                      --target-platform android-arm64 --split-per-abi \
                      --build-name="$VERSION_NAME" --build-number="$VERSION_CODE" \
                      --split-debug-info=build/symbols \
                      --dart-define=cronetHttpNoPlay=true \
                      --dart-define=PHOTOVAULT_SERVER=
                  apk_name="photovault-$VERSION_NAME-arm64.apk"
                  mkdir -p artifacts
                  mv build/app/outputs/flutter-apk/app-arm64-v8a-independent-release.apk "artifacts/$apk_name"
                  (cd artifacts && sha256sum "$apk_name" > SHA256SUMS)
                  rm -f "$RUNNER_TEMP/photovault-release.jks"

            - name: Check APK
              shell: bash
              env:
                  RELEASE: ${{ inputs.release || false }}
                  VERSION_NAME: ${{ steps.version.outputs.name }}
                  VERSION_CODE: ${{ steps.version.outputs.code }}
              run: |
                  set -euo pipefail
                  bt="$ANDROID_HOME/build-tools/35.0.0"
                  apk=$(ls artifacts/*.apk)
                  certs=$("$bt/apksigner" verify --print-certs "$apk")
                  echo "$certs"
                  if [ "$RELEASE" = true ] && ! grep -qi "SHA-256 digest: $PHOTOVAULT_CERT_SHA256" <<<"$certs"; then
                      echo "::error::Release APK is not signed with the Photovault release key"
                      exit 1
                  fi
                  badging=$("$bt/aapt2" dump badging "$apk")
                  grep -E "^package: name='app.photovault' versionCode='$VERSION_CODE' versionName='$VERSION_NAME'" <<<"$badging" \
                      || { echo "::error::unexpected package line: $(head -1 <<<"$badging")"; exit 1; }
                  # arm64 only.
                  if unzip -l "$apk" | grep -E ' lib/' | grep -v ' lib/arm64-v8a/'; then
                      echo "::error::APK contains native libraries for other ABIs"
                      exit 1
                  fi
                  # No Firebase, Play services, Sentry or Play Billing classes.
                  tmp="$RUNNER_TEMP/apk"
                  mkdir -p "$tmp" && unzip -q -o "$apk" 'classes*.dex' -d "$tmp"
                  if strings "$tmp"/classes*.dex | grep -E "Lcom/google/firebase/|Lcom/google/android/gms/|Lio/sentry/|Lcom/android/billingclient/"; then
                      echo "::error::APK contains Firebase, Play services, Sentry or Play Billing classes"
                      exit 1
                  fi
                  size=$(stat -c %s "$apk")
                  echo "APK size: $size bytes ($((size / 1048576)) MiB)"
                  echo "**$(basename "$apk")**: $((size / 1048576)) MiB ($size bytes)" >> "$GITHUB_STEP_SUMMARY"

            - name: Upload APK
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: photovault-android-arm64
                  path: mobile/apps/photos/artifacts/
                  if-no-files-found: error

            - name: Upload Dart symbols
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: photovault-android-symbols
                  path: mobile/apps/photos/build/symbols/
                  if-no-files-found: warn

            - name: Strip report (source + APK)
              shell: bash
              working-directory: .
              run: |
                  set -euo pipefail
                  apk=$(ls mobile/apps/photos/artifacts/*.apk)
                  python3 -I scripts/strip-report.py --check --apk "$apk" \
                      --output "$RUNNER_TEMP/strip-report/strip-report-apk.md"

            - name: Upload strip report
              if: ${{ !cancelled() }}
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: strip-report-apk
                  path: ${{ runner.temp }}/strip-report/
                  if-no-files-found: warn

    # Screenshots of the real app in an Android emulator (x86_64, API 34,
    # aosp_atd: no Google APIs). A separate job with its own x86_64 debug
    # build, so it never holds up or fails the APK artifact above
    # (continue-on-error). A Photovault server is built from the repo's
    # Dockerfile (server only, WEB=none) in the background while the APK
    # builds, and run with PHOTOVAULT_SKIP_EMAIL_VERIFICATION so the sign-up
    # flow can be driven; the emulator reaches it at 10.0.2.2. If the image
    # does not build, only the pre-login screens and the offline gallery are
    # captured. The UI is driven with adb (uiautomator + input) by
    # mobile/apps/photos/scripts/photovault/emulator_screens.py.
    photos-emulator-screens:
        runs-on: ubuntu-latest
        timeout-minutes: 150
        continue-on-error: true

        defaults:
            run:
                working-directory: mobile/apps/photos

        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Free runner disk space
              run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost

            - name: Build Photovault server image (background)
              shell: bash
              working-directory: .
              run: |
                  set -euo pipefail
                  mkdir -p "$RUNNER_TEMP/server"
                  nohup docker build --build-arg WEB=none -t photovault-ci . \
                      > "$RUNNER_TEMP/server/docker-build.log" 2>&1 &
                  echo $! > "$RUNNER_TEMP/server/docker-build.pid"

            - name: Enable KVM
              working-directory: .
              run: |
                  echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
                  sudo udevadm control --reload-rules
                  sudo udevadm trigger --name-match=kvm

            - name: Setup JDK 17
              uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
              with:
                  distribution: "temurin"
                  java-version: "17"

            - name: Restore Flutter SDK
              id: flutter-cache
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  key: flutter-${{ runner.os }}-${{ runner.arch }}-${{ env.FLUTTER_VERSION }}
                  path: ${{ runner.tool_cache }}/flutter/${{ env.FLUTTER_VERSION }}

            - name: Install Flutter
              shell: bash
              working-directory: .
              env:
                  CACHE_HIT: ${{ steps.flutter-cache.outputs.cache-hit }}
              run: |
                  set -euo pipefail
                  root="$RUNNER_TOOL_CACHE/flutter/$FLUTTER_VERSION"
                  if [ "$CACHE_HIT" != true ]; then
                      archive="$RUNNER_TEMP/flutter.tar.xz"
                      curl --retry 3 --retry-all-errors -fsSL \
                          "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${FLUTTER_VERSION}-stable.tar.xz" \
                          -o "$archive"
                      printf '%s  %s\n' "$FLUTTER_SHA256" "$archive" | sha256sum -c -
                      mkdir -p "$root"
                      tar xf "$archive" -C "$root"
                      rm -f "$archive"
                  fi
                  echo "$root/flutter/bin" >> "$GITHUB_PATH"
                  sed -i '/^untranslated-messages-file:/d' mobile/packages/strings/l10n.yaml

            - name: Install Android SDK packages
              shell: bash
              run: |
                  set -euo pipefail
                  sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
                  yes | "$sdkmanager" --licenses > /dev/null || true
                  for attempt in 1 2 3; do
                      if "$sdkmanager" --install "platforms;android-36" "build-tools;35.0.0" \
                          "ndk;${NDK_VERSION}" "cmake;3.22.1" "platform-tools" > /dev/null; then
                          break
                      fi
                      [ "$attempt" = 3 ] && exit 1
                      rm -rf "$ANDROID_HOME/ndk/${NDK_VERSION}" "$ANDROID_HOME/.temp" "$HOME/.android/cache"
                      sleep 15
                  done
                  echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

            - name: Install Rust Android target
              run: rustup target add x86_64-linux-android

            - name: Rust cache
              uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
              with:
                  workspaces: rust
                  shared-key: photovault-mobile-x64

            - run: flutter pub get --enforce-lockfile

            - name: Generate Rust bindings
              run: cargo codegen frb photos
              working-directory: rust

            # numkong 7.8.6 (via usearch) forward-declares
            # `extern "C" long syscall(long, ...) noexcept;` on Linux x86_64,
            # which clashes with Android bionic's unistd.h (no noexcept) and
            # stops the x86_64 Android build. arm64 never takes that branch.
            # Drop the noexcept in the fetched copy, for this emulator-only
            # debug build; the release APK job is untouched.
            - name: Patch numkong header for Android x86_64
              shell: bash
              working-directory: .
              run: |
                  set -euo pipefail
                  cargo fetch --manifest-path rust/bindings/frb/photos/Cargo.toml
                  shopt -s nullglob
                  hits=("$HOME"/.cargo/registry/src/*/numkong-*/include/numkong/capabilities.h)
                  [ ${#hits[@]} -gt 0 ] || { echo "numkong header not found"; exit 1; }
                  for f in "${hits[@]}"; do
                      sed -i 's/^extern "C" long syscall(long, \.\.\.) noexcept;$/extern "C" long syscall(long, ...);/' "$f"
                      grep -n 'long syscall' "$f"
                  done

            - name: Build x86_64 debug APK
              shell: bash
              run: |
                  set -euo pipefail
                  # No built-in server: the app opens on the connect screen.
                  flutter build apk --debug --flavor independent \
                      --target-platform android-x64 \
                      --dart-define=cronetHttpNoPlay=true \
                      --dart-define=PHOTOVAULT_SERVER=
                  cp build/app/outputs/flutter-apk/app-independent-debug.apk "$RUNNER_TEMP/photovault-x64-debug.apk"

            - name: Start Photovault server
              id: server
              shell: bash
              working-directory: .
              run: |
                  set -uo pipefail
                  pid=$(cat "$RUNNER_TEMP/server/docker-build.pid")
                  # Give the image build at most 30 more minutes.
                  for _ in $(seq 360); do kill -0 "$pid" 2>/dev/null || break; sleep 5; done
                  if ! docker image inspect photovault-ci > /dev/null 2>&1; then
                      echo "::warning::Server image did not build in time; capturing pre-login screens only."
                      tail -50 "$RUNNER_TEMP/server/docker-build.log" || true
                      echo "url=" >> "$GITHUB_OUTPUT"
                      exit 0
                  fi
                  docker run -d --name photovault -p 8080:8080 \
                      -e PHOTOVAULT_PUBLIC_URL=http://10.0.2.2:8080 \
                      -e PHOTOVAULT_SERVER_NAME="CI server" \
                      -e PHOTOVAULT_SKIP_EMAIL_VERIFICATION=true \
                      -e PHOTOVAULT_MDNS=false \
                      photovault-ci
                  for _ in $(seq 60); do
                      curl -fsS http://127.0.0.1:8080/photovault/info && { echo; break; }
                      sleep 2
                  done
                  if curl -fsS http://127.0.0.1:8080/photovault/info > /dev/null; then
                      echo "url=10.0.2.2:8080" >> "$GITHUB_OUTPUT"
                  else
                      echo "::warning::Server did not answer; capturing pre-login screens only."
                      docker logs photovault || true
                      echo "url=" >> "$GITHUB_OUTPUT"
                  fi

            - name: Capture screens in the emulator
              uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
              env:
                  PV_APK: ${{ runner.temp }}/photovault-x64-debug.apk
                  PV_SHOTS: ${{ runner.temp }}/emulator-screens
                  PV_SERVER: ${{ steps.server.outputs.url }}
              with:
                  api-level: 34
                  target: aosp_atd
                  arch: x86_64
                  profile: pixel_6
                  disable-animations: true
                  emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
                  working-directory: mobile/apps/photos
                  # One command: the action runs each script line in its own shell.
                  script: adb install -r -g "$PV_APK" && python3 -I scripts/photovault/emulator_screens.py --package app.photovault.debug --out "$PV_SHOTS" ${PV_SERVER:+--server "$PV_SERVER"}

            - name: Server log
              if: ${{ always() }}
              working-directory: .
              run: mkdir -p "$RUNNER_TEMP/emulator-screens" && { docker logs photovault > "$RUNNER_TEMP/emulator-screens/server.log" 2>&1 || true; }

            - name: Upload emulator screenshots
              if: ${{ always() }}
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: photovault-emulator-screens
                  path: ${{ runner.temp }}/emulator-screens/
                  if-no-files-found: warn
