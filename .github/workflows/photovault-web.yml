# PHOTOVAULT: web CI. Type-checks, lints and tests the web apps the Photovault
# server serves (photos, albums, cast, accounts and the shared packages), then
# builds their static export with web/scripts/photovault-build.sh and uploads
# it as an artifact (layout as served, see web/PHOTOVAULT.md).
name: photovault-web

on:
  push:
    paths:
      - "web/**"
      - "rust/**"
      - ".github/workflows/photovault-web.yml"
  pull_request:
    paths:
      - "web/**"
      - "rust/**"
      - ".github/workflows/photovault-web.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: photovault-web-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"
  # Empty = the web app talks to the server it was served from.
  NEXT_PUBLIC_ENTE_ENDPOINT: ""
  WASM_PACK_VERSION: "0.15.1"

jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: rust
          cache-bin: true

      - name: Rust toolchains (stable + the cast nightly)
        run: |
          rustup target add wasm32-unknown-unknown
          channel="$(sed -n 's/^channel = "\(.*\)"/\1/p' ../rust/bindings/wasm/cast/rust-toolchain.toml)"
          rustup toolchain install "$channel" --profile minimal \
              --component rust-src --target wasm32-unknown-unknown

      - name: wasm-pack
        run: |
          command -v wasm-pack >/dev/null && wasm-pack --version | grep -q "$WASM_PACK_VERSION" ||
              cargo install wasm-pack --locked --version "$WASM_PACK_VERSION"

      - name: npm ci
        run: npm ci --no-audit --no-fund

      - name: wasm builds
        run: |
          npm run build:prelogin-wasm
          npm run build:photos-wasm
          npm run build:cast-wasm

      - name: tsc
        run: |
          for ws in photos albums cast accounts ente-base ente-accounts ente-gallery ente-new ente-contacts; do
              echo "::group::tsc $ws"
              NODE_OPTIONS=--max-old-space-size=8192 npm exec --workspace "$ws" -- tsc --noEmit
              echo "::endgroup::"
          done

      - name: eslint
        run: |
          for ws in photos albums cast accounts ente-base ente-accounts ente-gallery ente-new ente-contacts; do
              echo "::group::eslint $ws"
              NODE_OPTIONS=--max-old-space-size=8192 npm exec --workspace "$ws" -- eslint --max-warnings 0
              echo "::endgroup::"
          done

      - name: vitest
        run: |
          npm run test --workspace photos
          npm run test --workspace ente-contacts

      - name: Static export
        env:
          PHOTOVAULT_SKIP_NPM_CI: "1"
          PHOTOVAULT_SKIP_WASM: "1"
          PHOTOVAULT_WEB_OUT: ${{ github.workspace }}/photovault-web
        run: scripts/photovault-build.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: photovault-web
          path: photovault-web
          if-no-files-found: error
          retention-days: 14
