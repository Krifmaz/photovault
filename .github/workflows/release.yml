# Tags and publishes a GitHub Release automatically.
#
# Every push to the default branch (or main) is a normal release, like Encore's
# hotfixes: plain vX.Y.Z (patch +1 each push), marked Latest, image :X.Y.Z,
# :X.Y and :latest. No pre-releases.
#
#   1. test     cargo test for the whole workspace
#   2. version  next tag from .github/release/next-version.sh
#   3. build    every workspace binary for Linux x86_64/arm64 and macOS arm64
#      web      (alongside build) the web apps' static export (photos, albums, cast, accounts,
#               embed) with web/scripts/photovault-build.sh, as photovault-web CI
#   4. image    ghcr.io/<owner>/photovault (amd64 + arm64): server + web apps
#      apks     (alongside build) both Android APKs: Photos (photovault-mobile.yml)
#               and Photovault Native (android-native.yml)
#   5. release  creates the tag and the GitHub Release with archives, APKs + SHA256SUMS
#
# The tag is only pushed once everything above succeeded. Pushes that only
# touch docs are ignored; put [skip ci] in a commit message to skip one.
# Run it by hand (Actions > Release > Run workflow) for a minor/major bump.
# New crates (node/, importers/) are picked up once they join the workspace.
name: Release

on:
  push:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "deploy/**"
      - "LICENSE"
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options: [patch, minor, major]
        default: patch

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  IMAGE: ghcr.io/${{ github.repository_owner }}/photovault

jobs:
  test:
    if: github.ref == 'refs/heads/main' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --workspace --no-fail-fast

  version:
    if: github.ref == 'refs/heads/main' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.next.outputs.tag }}
      version: ${{ steps.next.outputs.version }}
      skip: ${{ steps.next.outputs.skip }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: next
        env:
          BUMP: ${{ inputs.bump || 'patch' }}
        run: |
          done=$(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true)
          if [ -n "$done" ]; then
            echo "HEAD is already released as $done"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tag=$(.github/release/next-version.sh "$BUMP")
          echo "Next release: $tag"
          {
            echo "tag=$tag"
            echo "version=${tag#v}"
            echo "skip=false"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: version
    if: needs.version.outputs.skip == 'false'
    strategy:
      fail-fast: false
      matrix:
        include:
          # Built in bookworm so the binaries run on distroless/cc-debian12
          # and any distro with glibc >= 2.36.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
            container: mirror.gcr.io/library/rust:1-bookworm
            arch: amd64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04
            container: mirror.gcr.io/library/rust:1-bookworm
            arch: arm64
          - target: aarch64-apple-darwin
            os: macos-15
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    env:
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
      CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
      AR_aarch64_unknown_linux_gnu: aarch64-linux-gnu-ar
    steps:
      - uses: actions/checkout@v7
      - name: Cross toolchain
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          apt-get update
          apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
          rustup default stable
          command -v jq >/dev/null || { apt-get update && apt-get install -y --no-install-recommends jq; }
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        env:
          PHOTOVAULT_COMMIT: ${{ github.sha }}
        run: |
          export PHOTOVAULT_COMMIT="${PHOTOVAULT_COMMIT:0:7}"
          # photovault-core is a library for the apps (its uniffi-bindgen tool needs a feature); not shipped here
          cargo build --release --locked --workspace --exclude photovault-core --bins --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          name="photovault-${{ needs.version.outputs.tag }}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          for bin in $(cargo metadata --no-deps --format-version 1 \
                         | jq -r '.packages[] | select(.name != "photovault-core") | .targets[] | select(.kind[] == "bin") | .name'); do
            cp "target/${{ matrix.target }}/release/$bin" "dist/$name/"
          done
          cp LICENSE README.md "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          if [ -n "${{ matrix.arch }}" ]; then
            mkdir -p "image/bin/${{ matrix.arch }}"
            cp "target/${{ matrix.target }}/release/photovault" "image/bin/${{ matrix.arch }}/"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: matrix.arch != ''
        with:
          name: image-${{ matrix.arch }}
          path: image/
          if-no-files-found: error

  web:
    needs: version
    if: needs.version.outputs.skip == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # Empty = the web app talks to the server it was served from.
      NEXT_PUBLIC_ENTE_ENDPOINT: ""
      WASM_PACK_VERSION: "0.15.1"
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          cache-bin: true
          key: web
      - name: Rust toolchains (stable + the cast nightly)
        run: |
          rustup target add wasm32-unknown-unknown
          channel="$(sed -n 's/^channel = "\(.*\)"/\1/p' ../rust/bindings/wasm/cast/rust-toolchain.toml)"
          rustup toolchain install "$channel" --profile minimal \
              --component rust-src --target wasm32-unknown-unknown
      - name: wasm-pack
        run: |
          command -v wasm-pack >/dev/null && wasm-pack --version | grep -q "$WASM_PACK_VERSION" ||
              cargo install wasm-pack --locked --version "$WASM_PACK_VERSION"
      - name: Static export
        env:
          PHOTOVAULT_WEB_OUT: ${{ github.workspace }}/photovault-web
        run: |
          scripts/photovault-build.sh
          test -f "$PHOTOVAULT_WEB_OUT/index.html"
          for app in albums cast accounts embed; do test -f "$PHOTOVAULT_WEB_OUT/$app/index.html"; done
      - name: Package
        working-directory: .
        run: |
          mkdir -p dist
          tar -C photovault-web -czf "dist/photovault-web-${{ needs.version.outputs.tag }}.tar.gz" .
      - uses: actions/upload-artifact@v7
        with:
          name: web
          path: photovault-web
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: dist-web
          path: dist/*.tar.gz
          if-no-files-found: error

  apk-photos:
    needs: version
    if: needs.version.outputs.skip == 'false'
    uses: ./.github/workflows/photovault-mobile.yml
    secrets: inherit

  apk-native:
    needs: version
    if: needs.version.outputs.skip == 'false'
    uses: ./.github/workflows/android-native.yml
    secrets: inherit

  image:
    needs: [test, version, build, web]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: image-*
          path: .github/release
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: web
          path: .github/release/rootfs/app/web
      - name: Image root filesystem
        # /app/web holds the web job's export (Photos at the root, the other
        # apps in subfolders); the image serves it on the API port.
        run: |
          mkdir -p .github/release/rootfs/data .github/release/rootfs/config
          test -f .github/release/rootfs/app/web/index.html
          test -f .github/release/rootfs/app/web/albums/index.html
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.version.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.version.outputs.tag }}
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: .github/release
          file: .github/release/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  release:
    needs: [version, build, web, image, apk-photos, apk-native]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          pattern: photovault-android-arm64-*
          path: apk/photos
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: photovault-native-apk
          path: apk/native
      - name: APKs
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          # photovault-arm64-release.apk (or -debugsigned without the signing secrets)
          for f in apk/photos/*.apk; do
            b=$(basename "$f"); mv "$f" "dist/photovault-photos-$TAG-${b#photovault-}"
          done
          for f in apk/native/*.apk; do
            b=$(basename "$f" .apk); mv "$f" "dist/photovault-native-$TAG-${b#app-}.apk"
          done
          ls dist/*photos*.apk dist/*native*.apk
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS
      - name: Tag and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          gh release create "$TAG" dist/* \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Photovault $TAG" \
            --generate-notes --latest \
            --notes "Docker image: \`${IMAGE,,}:${{ needs.version.outputs.version }}\`"
