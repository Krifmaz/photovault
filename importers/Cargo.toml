[package]
name = "photovault-import"
description = "Import Immich libraries and iCloud Photos exports into Photovault (or any Ente-compatible server), encrypting everything client-side. Based on Ente (ente.com)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "photovault-import"
path = "src/main.rs"

[dependencies]
anyhow = "1"
thiserror = "2"
async-trait = "0.1"
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
clap = { version = "4", features = ["derive", "env"] }
csv = "1"
futures-util = "0.3"
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "tiff", "bmp"] }
kamadak-exif = "0.6"
libsodium-sys-stable = "1.24"
md-5 = "0.10"
num-bigint-dig = "0.8"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2", "json", "query", "stream"] }
rpassword = "7"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "time", "process"] }
tokio-util = { version = "0.7", features = ["io"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2"
walkdir = "2"
zip = { version = "9", default-features = false, features = ["deflate"] }

[dev-dependencies]
axum = { version = "0.8", features = ["macros"] }
# End-to-end tests against the real Photovault server, in process.
photovault-server = { path = "../server" }
