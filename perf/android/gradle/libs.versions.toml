# Pinned to releases known to exist. Bump them together and let CI (.github/workflows/perf.yml)
# confirm the build; AGP 8.13 needs Gradle >= 8.13 and JDK 17+.
[versions]
agp = "8.13.0"
kotlin = "2.2.20"
benchmark = "1.4.1"
uiautomator = "2.3.0"
androidxTestExtJunit = "1.3.0"
androidxTestRunner = "1.7.0"
compileSdk = "36"
minSdk = "28"
targetSdk = "36"

[libraries]
benchmark-macro-junit4 = { module = "androidx.benchmark:benchmark-macro-junit4", version.ref = "benchmark" }
uiautomator = { module = "androidx.test.uiautomator:uiautomator", version.ref = "uiautomator" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExtJunit" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-test = { id = "com.android.test", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
