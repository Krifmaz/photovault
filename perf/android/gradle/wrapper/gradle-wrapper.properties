# No wrapper jar or gradlew script is checked in. CI runs this exact Gradle version through
# gradle/actions/setup-gradle (gradle-version: 8.14.3). Locally, use a Gradle 8.14.3 install
# (`gradle -p perf/android ...`) or run `gradle wrapper --gradle-version 8.14.3` once with
# network access to generate the wrapper.
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.14.3-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
