[package]
name = "ente-image"
edition = "2024"

[dependencies]
ente_heic = { package = "heic_decoder", git = "https://github.com/ente/heic-decoder.git", rev = "c5d83bdce7d28a755fbe75dd981bfcce521d9c35", features = [
    "image-integration",
] }
fast_image_resize = { version = "6.1.0", features = ["image"] }
image = "0.25.10"
jxl-oxide = { version = "0.12.6", features = ["image"] }
kamadak-exif = "0.6.1"
log = "0.4.34"
moxcms = { version = "0.9.1", features = ["in_place"] }
png = "0.18.1"
thiserror = "2.0.21"
tiff = "0.11.3"

[dev-dependencies]
tempfile = "3.27.0"

# [lints] inherited from Ente's workspace: removed by sync-ente-ml.sh because
# Ente's workspace lints do not apply outside Ente's workspace.
