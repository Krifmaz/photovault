[package]
name = "ente-ml"
edition = "2024"

[features]
default = []
ml-assets = []
usearch = ["dep:usearch"]

[dependencies]
ente-assets = { path = "../assets" }
ente-image = { path = "../image" }
fast_image_resize = { version = "6.1.0", features = ["image", "rayon"] }
half = "2.1.0"
html-escape = "0.3.0"
image = "0.25.10"
imageproc = "0.27.0"
log = "0.4.34"
nalgebra = "0.35.0"
once_cell = "1.20.2"
plsfix = "0.1.8"
rayon = "1.12.0"
regex = "1.13.1"
thiserror = "2.0.21"
usearch = { version = "=2.26.5", optional = true }

# Cargokit sets ORT_LIB_PATH to Ente's verified iOS archive.
[target.'cfg(target_os = "ios")'.dependencies]
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "ndarray", "half", "coreml", "api-31"] }

[target.'cfg(target_os = "android")'.dependencies]
ash = { version = "0.38.0", default-features = false, features = ["loaded"] }
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["ndarray", "half", "api-31", "load-dynamic", "copy-dylibs", "webgpu", "xnnpack"] }

[target.'cfg(target_os = "macos")'.dependencies]
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["ndarray", "half", "coreml", "api-31", "load-dynamic", "copy-dylibs"] }

# PHOTOVAULT PATCH: add the cuda, rocm and migraphx ort features (desktop GPU
# execution providers; no build-time effect with load-dynamic).
[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["ndarray", "half", "api-31", "load-dynamic", "copy-dylibs", "webgpu", "cuda", "rocm", "migraphx"] }

[target.'cfg(not(any(target_os = "ios", target_os = "android", target_os = "macos", target_os = "linux", target_os = "windows")))'.dependencies]
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["ndarray", "half", "api-31", "load-dynamic", "copy-dylibs"] }

[dev-dependencies]
anyhow = "1.0.104"
flate2 = "1.1.10"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tar = "0.4.46"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["macros", "rt"] }
url = "2.5.8"

# [lints] inherited from Ente's workspace: removed by sync-ente-ml.sh because
# Ente's workspace lints do not apply outside Ente's workspace.
