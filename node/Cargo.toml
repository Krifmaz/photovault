[package]
name = "photovault-node"
description = "Photovault compute node: indexes an Ente library (faces, search, streamable video) on hardware you own and uploads results in Ente's own encrypted formats. Based on Ente (ente.com)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "photovault-node"
path = "src/main.rs"

[features]
default = []
# On-device ML via Ente's own Rust ML crate (vendored) on ONNX Runtime.
# Pending approval for the ONNX Runtime C++ dependency; see README.
ml = []

[dependencies]
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
flate2 = "1"
hex = "0.4"
libsodium-sys-stable = "1.24"
num-bigint-dig = "0.8"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "fs", "io-util", "process", "time", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2"
zeroize = { version = "1", features = ["derive"] }
sysinfo = "0.37"
dirs = "6"

[dev-dependencies]
tempfile = "3"
