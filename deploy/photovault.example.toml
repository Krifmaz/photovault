# Photovault configuration file. Optional: environment variables alone are enough.
# Use it with `--config /config/photovault.toml` or PHOTOVAULT_CONFIG.
# Every key is optional except public_url. PHOTOVAULT_* environment variables
# override the file. See docs/src/configuration.md.

# What the apps connect to (API, web app, albums, cast).
public_url = "https://photos.example.com"
# LAN address, advertised in /photovault/info and mDNS.
# home_url = "http://192.168.1.10:8095"
# server_name = "Photovault"
# listen = "0.0.0.0:8080"

# Folder for keys.toml and the SQLite database (photovault.db).
# config_dir = "/config"
# Empty = SQLite at <config_dir>/photovault.db. PostgreSQL:
# database_url = "postgres://photovault:password@db:5432/photovault"

# Built web app served on the API port (the image sets /app/web).
# web_dir = "/app/web"

allow_signups = false
# admins = [1]
# log_format = "pretty"   # or "json"
# mdns = true
# skip_email_verification = false

# Quota for new accounts in bytes (0 = none). The env form takes sizes: PHOTOVAULT_DEFAULT_QUOTA=500GB.
# default_storage_bytes = 0
# Total bytes the server may store (needed for real numbers on S3). Env: PHOTOVAULT_STORAGE_LIMIT=4TB.
# storage_limit = 4398046511104

# Keys are normally kept in <config_dir>/keys.toml, created on first start.
# Set them here only to override that file.
# [secrets]
# jwt = ""
# encryption = ""
# hashing = ""

[storage]
kind = "local"
path = "/data"
# Base of signed upload/download URLs (defaults to public_url).
public_url = "https://storage.photos.example.com"

# [storage]
# kind = "s3"
# endpoint = "https://s3.eu-central-003.backblazeb2.com"
# public_endpoint = "https://s3.eu-central-003.backblazeb2.com"
# region = "eu-central-003"
# bucket = "my-photovault"
# access_key = "..."
# secret_key_file = "/run/secrets/s3_secret"
# path_style = true

# [accounts]
# Where the public albums web app is served; share links point here.
# public_albums_url = "https://photos.example.com/shared-albums"

# [smtp]
# host = "smtp.example.com"
