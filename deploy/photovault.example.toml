# Photovault configuration. Every key is optional; PHOTOVAULT_* environment
# variables override the file. See docs/src/configuration.md.

listen = "0.0.0.0:8080"
# What you type into the apps as the server endpoint.
public_url = "https://photos.example.com"
# PostgreSQL: "postgres://photovault:password@db:5432/photovault"
database_url = "sqlite:///db/photovault.sqlite?mode=rwc"
allow_signups = false
admins = []
log_format = "json"

[secrets]
# head -c 32 /dev/urandom | base64   (one per key; keep them safe and stable)
jwt = ""
encryption = ""
hashing = ""

[storage]
kind = "local"
path = "/data"
# Hostname used in signed upload/download URLs (defaults to public_url).
public_url = "https://storage.photos.example.com"

