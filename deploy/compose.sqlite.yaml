# Photovault with SQLite (single user / small family). One container, no database server.
#
#   /drivepool/photovault  encrypted objects
#   /opt/photovault        photovault.sqlite (keep on local SSD, NOT on mergerfs/NFS)
name: photovault

services:
  photovault:
    image: ${PHOTOVAULT_IMAGE:-photovault:latest}
    restart: unless-stopped
    environment:
      PHOTOVAULT_PUBLIC_URL: https://${PHOTOS_HOST:?set PHOTOS_HOST}
      PHOTOVAULT_STORAGE_PUBLIC_URL: https://${STORAGE_HOST:-${PHOTOS_HOST}}
      PHOTOVAULT_STORAGE_PATH: /data
      PHOTOVAULT_DATABASE_URL: sqlite:///db/photovault.sqlite?mode=rwc
      PHOTOVAULT_JWT_SECRET: ${PHOTOVAULT_JWT_SECRET:?set it to the output of head -c 32 /dev/urandom | base64}
      PHOTOVAULT_ENCRYPTION_KEY: ${PHOTOVAULT_ENCRYPTION_KEY:?set it to the output of head -c 32 /dev/urandom | base64}
      PHOTOVAULT_HASHING_KEY: ${PHOTOVAULT_HASHING_KEY:?set it to the output of head -c 32 /dev/urandom | base64}
      PHOTOVAULT_ALLOW_SIGNUPS: ${PHOTOVAULT_ALLOW_SIGNUPS:-false}
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      - /drivepool/photovault:/data
      - /opt/photovault:/db
    networks:
      - proxy_net
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    mem_limit: 256m

networks:
  proxy_net:
    external: true
