# Photovault on a home network: one container, SQLite, no reverse proxy.
# Paste into a Portainer stack, or run `docker compose -f deploy/compose.yaml up -d`.
#
# Before the first start, give the two host folders to the container's user:
#   mkdir -p /drivepool/photovault /opt/photovault
#   chown -R 65532:65532 /drivepool/photovault /opt/photovault
#
# Then enter http://10.0.1.7:8095 in the apps ("Connect to your server").
# Domain behind a reverse proxy: compose.domain.yaml. PostgreSQL: compose.postgres.yaml.
# Every setting: docs/src/configuration.md.
name: photovault
services:
  photovault:
    # The server, the web app and the admin CLI in one image (runs as uid 65532).
    image: ghcr.io/krifmaz/photovault:edge
    # Start again after a crash or reboot. A failed startup check waits 30 s
    # before it exits, so this does not spin.
    restart: unless-stopped
    ports:
      # Host port 8095 -> the server's port 8080 (API, web app and photo up/downloads).
      - "8095:8080"
    environment:
      # The address the apps and the web app use. The only required setting.
      # Photo up/downloads use it too unless PHOTOVAULT_STORAGE_PUBLIC_URL is set.
      PHOTOVAULT_PUBLIC_URL: http://10.0.1.7:8095
      # Optional settings (remove the # to use one):
      # Name shown in the apps, in emails and on the LAN.
      # PHOTOVAULT_SERVER_NAME: Photovault
      # LAN address, when PUBLIC_URL is a domain (see compose.domain.yaml).
      # PHOTOVAULT_HOME_URL: http://10.0.1.7:8095
      # Quota for new accounts; unset = the free disk space is the limit.
      # PHOTOVAULT_DEFAULT_QUOTA: 500GB
      # Email the sign-in codes. Without SMTP they are written to the log:
      #   Verification code for <email>: <code>
      # PHOTOVAULT_SMTP_HOST: smtp.example.com
      # PHOTOVAULT_SMTP_PORT: "587"
      # PHOTOVAULT_SMTP_USERNAME: photos@example.com
      # PHOTOVAULT_SMTP_PASSWORD: change-me
      # PHOTOVAULT_SMTP_FROM: Photovault <photos@example.com>
      # PHOTOVAULT_SMTP_TLS: starttls          # starttls | tls | none
      # Logs as JSON lines instead of plain text.
      # PHOTOVAULT_LOG_FORMAT: json
      # Stop announcing the server on the LAN (mDNS). Inside a bridge network the
      # announcement does not reach the LAN anyway; use the photovault-mdns service below.
      # PHOTOVAULT_MDNS: "false"
    volumes:
      - /drivepool/photovault:/data   # encrypted photos
      - /opt/photovault:/config       # database + keys (local disk)
    # The container cannot change its own files outside /data and /config.
    read_only: true
    # No privilege escalation (setuid binaries), no Linux capabilities.
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  # Optional: lets the apps find the server on the LAN without typing an address.
  # Multicast does not leave Docker's bridge network, so this small service runs
  # on the host network, reads /photovault/info and announces _photovault._tcp.
  # photovault-mdns:
  #   image: ghcr.io/krifmaz/photovault:edge
  #   restart: unless-stopped
  #   command: ["announce", "--server", "http://127.0.0.1:8095"]
  #   network_mode: host
  #   healthcheck: {disable: true}   # the image's check probes port 8080, which is not here
  #   read_only: true
  #   security_opt: [no-new-privileges:true]
  #   cap_drop: [ALL]
