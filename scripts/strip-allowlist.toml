path = ["rust/crates/ml/src/assets.rs", "rust/crates/ml/src/ocr/assets.rs", "rust/crates/ml/src/scan/mod.rs"]
term = "ente.com"
line = "https://models\\.ente\\.com/"
category = "pending-user-decision"
reason = "ML model downloads from models.ente.com; where the models come from is left to the owner."
[[allow]]
path = "rust/crates/photos/src/location.rs"
term = "ente.com"
line = "^const ASSET_URL: &str = \"https://assets\\.ente\\.com/location/v2\";$"
category = "upstream-only-app-not-built"
reason = "LocationIndex::open default, used only by Ente's CLI; the apps call open_from with <server>/static-assets/location/v2."
[[allow]]
path = "rust/crates/core/src/urls.rs"
term = "ente.com"
line = "^pub const PRODUCTION_API_ORIGIN: &str = \"https://api\\.ente\\.com\";$"
category = "upstream-only-app-not-built"
reason = "ente_core default API origin for Ente's CLI; the apps always pass their configured endpoint."
[[allow]]
path = "rust/crates/accounts/src/auth/payload.rs"
term = "ente.com"
line = "^Some\\(\"api\\.ente\\.com\" \\| \"api\\.ente\\.in\" \\| \"localhost\"\\)$"
category = "upstream-security-logic"
reason = "enforce_auth_payloads: stricter login-token checks only for Ente's API hosts; makes no request, left as is."
[[allow]]
path = "rust/crates/accounts/src/admin.rs"
term = ["subscription", "ente"]
line = "^/admin/user/subscription$|Test mail from Ente"
category = "upstream-only-app-not-built"
reason = "Admin client calls used only by Ente's CLI; no binding the apps build exposes them."
[[allow]]
path = "rust/crates/photos/src/files.rs"
term = "ente"
line = "Update your Ente server"
category = "upstream-only-app-not-built"
reason = "Error of files::download, used only by Ente's CLI and photos-export; the apps do not call it."
[[allow]]
path = "rust/crates/legacy/src/error.rs"
term = "ente"
line = "^legacy contact is not on Ente$"
category = "internal-identifier"
reason = "Display text of ContactNotOnEnte; Photos matches the variant (LegacyError_ContactNotOnEnte, web: contact_not_on_ente) and shows its own invite dialog, never this text."
[[allow]]
path = "rust/crates/ml/src/onnx/coreml_cache.rs"
term = "ente"
line = "^ente$"
category = "internal-identifier"
reason = "Directory name of the Core ML compile cache (Library/Caches/ente/ml/coreml); never shown."

# ---------------------------------------------------------------------------
# Built APK (--apk). Written from the sources above; the APK is built only in
# CI (photovault-mobile.yml), so check these against the first report of a
# real build. Compiled translations are covered by the translation-key rule.

[[allow]]
path = ["apk:lib/*/libapp.so", "apk:lib/*/libente*.so"]
term = "ente.com"
line = "models\\.ente\\.com"
category = "pending-user-decision"
reason = "ML model downloads from models.ente.com (rust/crates/ml, remote_assets_service.dart), owner to decide."
[[allow]]
path = "apk:lib/*/libente*.so"
term = "ente.com"
line = "assets\\.ente\\.com/location/v2"
category = "upstream-only-app-not-built"
reason = "LocationIndex::open default for the CLI (rust/crates/photos/src/location.rs); the app calls open_from with its server."
[[allow]]
path = "apk:lib/*/libente*.so"
term = "ente.com"
line = "api\\.ente\\.com"
category = "upstream-security-logic"
reason = "ente_core PRODUCTION_API_ORIGIN (CLI default; the app passes its endpoint) and the extra auth-payload checks for Ente's API host (rust/crates/accounts/src/auth/payload.rs)."
[[allow]]
path = "apk:lib/*/libapp.so"
term = ["ente.com", "ente.io"]
line = "^https://api\\.ente\\.(com|io)$"
category = "upstream-only-app-not-built"
reason = "packages/configuration kDefault/kLegacyProductionEndpoint (BaseConfiguration default of Ente Auth/Locker); Photos uses its own EndpointConfig."
[[allow]]
path = "apk:res/xml/network_security_config.xml"
term = ["ente.io", "ente.com"]
line = "^ente\\.(io|com)$"
category = "inert-config"
reason = "Compiled network_security_config.xml: upstream rule forcing TLS for Ente domains; makes no request."
[[allow]]
path = "apk:AndroidManifest.xml"
term = "ente"
line = "^ente$"
category = "internal-identifier"
reason = "ente:// deep-link scheme (passkey return, notifications), see the source entry."
[[allow]]
path = "apk:assets/flutter_assets/AssetManifest.json"
term = "duck"
line = "ducky"
category = "replaced-asset-path"
reason = "Asset file names kept from upstream; the duck art was re-rendered as the Photovault glyph (PHOTOVAULT.md, Mascot)."
