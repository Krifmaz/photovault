# PHOTOVAULT: strip report allowlist (new file).
#
# Explanations for the hits of scripts/strip-report.py. The report
# (docs/src/strip-report.md) lists every hit with the entry that explains it;
# a hit no entry explains fails `--check` in CI.
#
# [[allow]] entries:
#   path     glob or list of globs, repo-relative ("*" also matches "/").
#            APK members are "apk:<member>", web export files are
#            "web-out:<dir as given, relative to the repo>/<file>".
#   term     a term id of strip-report.py (TERMS), a list, or "*".
#   line     optional regex the hit's text (the code or string on that line)
#            must match. Use it: an entry should explain the hits it was
#            written for, not whatever lands in that file later.
#   when     optional: "translation-key-unreferenced" = the hit is a
#            translation value whose key no scanned source file references.
#   category one of [categories] below; reason: one line, why it stays.
#
# User-visible Ente branding is fixed in the code, not listed here. The only
# user-visible Ente mention the project allows is the plain "Based on Ente"
# credit in About.
#
# [[exclude]] paths are not scanned at all; the report lists them.

[categories]
about-credit = "The plain \"Based on Ente\" credit in About, the one allowed user-visible mention of Ente."
internal-identifier = "Identifiers that are never shown as text: URI schemes, package/app ids, enum values, storage keys, CSS hooks, file names."
api-field-name = "Names in the Ente API that the Photovault server implements (paths, JSON fields, models); renaming them breaks the protocol."
server-plan-wording = "Generic plan/subscription wording for errors the Photovault server really returns (it keeps museum's per-user plan: quota and expiry, set by the admin). Not Ente branding."
log-message = "Developer log or diagnostic text (logs, adb dumps, exceptions caught and logged); not shown in the UI."
unused-string = "Translation value whose key no Photovault app code references any more; never displayed."
upstream-only-app-not-built = "Code path or text that runs only for Ente's other apps (Auth, Locker, Legacy Kit, Space) or platforms Photovault does not ship."
upstream-security-logic = "Upstream security checks that name Ente hosts; left untouched so security is not weakened."
inert-config = "Configuration that names an Ente host or service but makes no request and shows nothing."
replaced-asset-path = "Asset file name kept from upstream; the content (duck mascot) was replaced or is no longer drawn."
pending-user-decision = "Still contacts an Ente host; left on purpose until the project owner decides (ML model downloads)."
third-party-data = "Data inside a bundled third-party library (word lists etc.)."
package-metadata = "Package/build metadata (pubspec description, package.json name) that is not shipped in or shown by the apps."

