[[exclude]]
path = "*/pubspec.lock"
reason = "dependency lockfile, not shipped"
[[exclude]]
path = "*/package-lock.json"
reason = "dependency lockfile, not shipped"
[[exclude]]
path = "web/packages/wasm/*/pkg/*"
reason = "generated wasm-bindgen output; its Rust source (rust/bindings/wasm/*) is scanned"

