reason = "Next.js build cache (the export is scanned with --web-out instead)"
[[exclude]]
path = "web/apps/*/out/*"
reason = "web static export (scanned with --web-out)"
[[exclude]]
path = "*/test/*"
reason = "tests, not shipped"
[[exclude]]
path = "*/tests/*"
reason = "tests, not shipped"
[[exclude]]
path = "*/Tests/*"
reason = "tests, not shipped"
[[exclude]]
path = "*/integration_test/*"
reason = "tests, not shipped"
[[exclude]]
path = "rust/*/tests.rs"
reason = "Rust test modules, not shipped"
[[exclude]]
path = "rust/*/test_*.rs"
reason = "Rust test modules, not shipped"
[[exclude]]
path = "*.test.ts"
reason = "tests, not shipped"
[[exclude]]
path = "*.g.dart"
reason = "generated code (json_serializable etc.); its source is scanned"
[[exclude]]
path = "*.freezed.dart"
reason = "generated code; its source is scanned"
[[exclude]]
path = "mobile/packages/strings/lib/l10n/strings_localizations*.dart"
reason = "generated from the .arb files, which are scanned"
[[exclude]]
path = "mobile/apps/photos/lib/generated/*"
reason = "generated from the .arb files, which are scanned"
[[exclude]]
