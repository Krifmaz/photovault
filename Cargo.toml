[workspace]
resolver = "3"
members = ["server", "node"]
# Vendored upstream Ente crates (node/scripts/sync-ente-ml.sh) are path
# dependencies of photovault-node, not members: they keep Ente's own code
# style and are not held to this workspace's clippy settings.
exclude = ["node/vendor"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/Krifmaz/photovault"
rust-version = "1.90"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
